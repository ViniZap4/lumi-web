# CI do lumi-web no Gitea (org lumi): npm ci, svelte-check, vitest e build de produção.
# Checkout pela variável LAN_GIT_URL (o Gitea se anuncia aos jobs como http://gitea:3000).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Vite 7 exige Node 20.19+/22.12+. Imagem com git (não-slim) para o checkout manual.
      image: node:22.23.5-bookworm
    timeout-minutes: 20
    env:
      GITEA_URL: ${{ vars.LAN_GIT_URL }}
      CI: "true"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          [ -n "$GITEA_URL" ] || { echo "::error::defina a variável de organização LAN_GIT_URL"; exit 1; }
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git config --global "http.$GITEA_URL/.extraheader" "AUTHORIZATION: basic $auth"
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITEA_URL/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git config --global --unset-all "http.$GITEA_URL/.extraheader"
          git log --oneline -1

      - name: npm ci
        run: npm ci --no-audit

      - name: svelte-check
        run: |
          set -eu
          if [ -x node_modules/.bin/svelte-check ]; then
            npx --no-install svelte-check --tsconfig ./tsconfig.json --threshold error
          else
            echo "::warning::svelte-check não está nas devDependencies (ver PROPOSTA.md); etapa pulada"
          fi

      - name: vitest
        run: npm test

      - name: build
        env:
          VITE_LUMI_SERVER_URL: https://lumi-api.example.ts.net
        run: npm run build

      - name: npm audit (informativo)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
