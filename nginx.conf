server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — defence-in-depth alongside the CSP meta tag in
    # index.html. `frame-ancestors` and HSTS can only be set via header,
    # not via meta. CSP body here mirrors the meta tag plus the header-
    # only `frame-ancestors 'none'`.
    #
    # nginx gotcha: `add_header` in a nested `location` block resets
    # inheritance of outer add_header directives. Locations below
    # therefore only use `expires` (which doesn't interact with
    # add_header inheritance), preserving these server-level headers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # HSTS is harmless over HTTP (browsers ignore it) and load-bearing
    # the moment a TLS terminator is put in front. 6 months, include
    # subdomains, preload-ready.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed Vite assets; index.html stays no-cache so a
    # redeploy is picked up immediately. `expires` doesn't reset
    # add_header inheritance.
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
